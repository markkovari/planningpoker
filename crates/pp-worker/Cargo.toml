[package]
name = "pp-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pp-domain     = { workspace = true, features = ["serde"] }
pp-events     = { workspace = true }
pp-projection = { workspace = true }
pp-jira       = { workspace = true }

worker        = { version = "0.8.3", features = ["d1"] }
wasm-bindgen  = "0.2"
js-sys        = "0.3"
serde         = { workspace = true }
serde_json    = { workspace = true }
uuid          = { version = "1", features = ["v4", "serde", "js"] }
